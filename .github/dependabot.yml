version: 2
updates:

  # npm — React, Vite, and all JS/TS dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3        # holds back brand-new releases for 3 days (supply-chain safety)
      semver-major-days: 14  # major version bumps wait 2 weeks (breaking-change risk)
    groups:
      # Bundle all patch + minor updates into one PR per week
      all-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Dev dependencies (ESLint, Prettier, Vitest) in a separate group
      dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
    open-pull-requests-limit: 5

  # GitHub Actions — keep CI workflow versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
